<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMCAF — Run History</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#ffffff;color:#111827;min-height:100vh;padding:24px 28px}
  a{color:#2563eb;text-decoration:none}
  a:hover{text-decoration:underline}

  header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .header-left h1{font-size:22px;font-weight:600;color:#111827;margin-bottom:4px}
  .header-left p{font-size:13px;color:#6b7280}
  .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .back-btn{display:inline-flex;align-items:center;gap:8px;background:#ffffff;color:#111827;border:1px solid #d1d5db;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .15s}
  .back-btn:hover{background:#f9fafb;text-decoration:none}
  .run-btn{display:inline-flex;align-items:center;gap:8px;background:#238636;color:#111827;border:1px solid #2ea043;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .15s}
  .run-btn:hover{background:#2ea043;text-decoration:none}

  .summary-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .sum-card{background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;min-width:120px;flex:1;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .sum-card .val{font-size:26px;font-weight:600;line-height:1;color:#111827}
  .sum-card .lbl{font-size:11px;color:#6b7280;margin-top:4px}

  .history-grid{display:flex;flex-direction:column;gap:10px}
  .hist-card{background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .hist-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;gap:12px}
  .hist-header:hover{background:#f9fafb}
  .hist-run{font-family:ui-monospace,monospace;font-size:11px;background:#f3f4f6;padding:2px 7px;border-radius:4px;color:#111827;flex-shrink:0}
  .hist-meta{flex:1;margin-left:10px}
  .hist-title{font-size:13px;font-weight:500;color:#111827}
  .hist-sub{font-size:11px;color:#6b7280;margin-top:3px}
  .hist-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:12px}
  .badge.pass{background:#ecfdf3;color:#047857;border:1px solid #a7f3d0}
  .badge.fail{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
  .badge.rate{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
  .badge.perfect{background:#ecfdf3;color:#047857;border:1px solid #a7f3d0}
  .chevron{color:#6b7280;font-size:11px;transition:transform .2s;flex-shrink:0}
  .chevron.open{transform:rotate(90deg)}

  .hist-body{display:none;border-top:1px solid #e5e7eb}
  .hist-body.open{display:block}
  .hist-scenarios{display:flex;flex-direction:column;gap:6px;padding:12px 16px}

  .sc-row{background:#f9fafb;border-radius:6px;overflow:hidden}
  .sc-row-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;gap:8px}
  .sc-row-header:hover{background:#f3f4f6}
  .sc-row-title{font-size:12px;color:#111827;flex:1}
  .sc-row-badges{display:flex;gap:6px;flex-shrink:0}
  .sc-row-chevron{color:#6b7280;font-size:10px;transition:transform .2s;flex-shrink:0}
  .sc-row-chevron.open{transform:rotate(90deg)}
  .sc-findings{display:none;border-top:1px solid #e5e7eb;overflow-x:auto}
  .sc-findings.open{display:block}

  table{width:100%;border-collapse:collapse;font-size:11px;min-width:500px}
  th{background:#f3f4f6;color:#6b7280;font-weight:500;text-align:left;padding:7px 12px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
  td{padding:7px 12px;border-bottom:1px solid #e5e7eb;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.fail-row td{background:#fef2f2}
  .s-pass{color:#047857;font-weight:600}
  .s-fail{color:#dc2626;font-weight:600}
  .ctrl{font-family:ui-monospace,monospace;font-size:10px;background:#f3f4f6;padding:1px 5px;border-radius:3px}
  .prov{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:500}
  .prov.aws{background:#ecfdf3;color:#047857}
  .prov.azure{background:#eff6ff;color:#2563eb}
  .prov.gcp{background:#fff7ed;color:#b45309}
  .refs{color:#6b7280;font-size:10px;line-height:1.6}
  .attr{font-family:ui-monospace,monospace;font-size:9px;color:#6b7280}
  .detail-fail{color:#dc2626;font-size:11px}
  .detail-pass{color:#111827;font-size:11px}

  .empty{text-align:center;padding:60px 20px;color:#6b7280;font-size:14px}
  .loading{text-align:center;padding:60px 20px;color:#6b7280;font-size:14px}
  footer{margin-top:28px;font-size:11px;color:#6b7280;text-align:center;padding-bottom:8px}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>AMCAF — Run History</h1>
    <p>All simulation runs &nbsp;·&nbsp; most recent first</p>
  </div>
  <div class="btn-row">
    <a class="back-btn" href="index.html">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06z"/></svg>
      Back to dashboard
    </a>
    <a class="run-btn" href="https://github.com/DMA-1970/AMCAF/actions/workflows/run-simulation.yml" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 3a.75.75 0 0 1 .75.75v3.5l2.25 1.3a.75.75 0 1 1-.75 1.3L7.5 9.5A.75.75 0 0 1 7 8.75v-4A.75.75 0 0 1 8 4.5z"/></svg>
      Run simulation
    </a>
  </div>
</header>

<div id="summary-bar" class="summary-bar"></div>
<div id="history-grid" class="history-grid">
  <div class="loading">Loading run history…</div>
</div>

<footer>
  AMCAF v1.0 &nbsp;·&nbsp; MSc Enterprise IT Management, University of Essex Online &nbsp;·&nbsp;
  <a href="https://github.com/DMA-1970/AMCAF" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
// C-01: reads history/history.json (flat schema) not history/index.json (old CI schema)
const BASE = 'https://raw.githubusercontent.com/DMA-1970/AMCAF/main/results/';

const SC_LABELS = {
  'sc-01':    'SC-01 — Fully compliant baseline',
  'sc-02':    'SC-02 — Over-privileged IAM (AWS) / MFA disabled (Azure)',
  'sc-03':    'SC-03 — Encryption disabled (AWS) / Weak TLS (Azure) / Public bucket (GCP)',
  'sc-04':    'SC-04 — Logging disabled across all providers',
  'sc-05':    'SC-05 — Open SSH (AWS) / Permissive firewall (GCP)',
  'sc-06':    'SC-06 — Dormant accounts (AWS, GCP) / Insufficient log retention',
  'sc-07':    'SC-07 — Full 20-control compliant baseline',
  'sc-08':    'SC-08 — Full 20-control failure scenario',
  'live-aws':   'AWS — Live Identity & Security Assessment',
  'live-entra': 'Azure — Live Entra Identity Governance',
  'live-gcp':   'GCP — Live Identity & Security Assessment',
  'baseline':   'Multi-provider baseline assessment',
};

const PROVIDER_COLOURS = {
  'live-aws': '#3fb950', 'live-entra': '#58a6ff', 'live-gcp': '#ffa657',
};

async function fetchJSON(url){
  const r = await fetch(url + '?nc=' + Date.now());
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function badge(cls, txt){ return `<span class="badge ${cls}">${txt}</span>`; }
function rateClass(r){ const n = parseFloat(r); return n === 100 ? 'perfect' : n >= 80 ? 'rate' : 'fail'; }

function buildHistCard(entry, idx){
  const rate   = Number(entry.compliance_rate || 0);
  const rc     = rateClass(rate);
  const ts     = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : '—';
  const scenario = entry.scenario || '—';
  const label    = SC_LABELS[scenario] || scenario;
  const colour   = PROVIDER_COLOURS[scenario] || '#8b949e';

  return `
    <div class="hist-card">
      <div class="hist-header">
        <span class="hist-run" style="border-left:3px solid ${colour};padding-left:8px">${entry.run_id || ('RUN-' + (idx+1))}</span>
        <div class="hist-meta">
          <div class="hist-title">${label}</div>
          <div class="hist-sub">${ts} &nbsp;·&nbsp; ${entry.total_checks || 0} checks</div>
        </div>
        <div class="hist-badges">
          ${badge('pass', (entry.passed || 0) + ' pass')}
          ${(entry.failed || 0) > 0 ? badge('fail', entry.failed + ' fail') : ''}
          ${badge(rc, rate.toFixed(1) + '%')}
        </div>
      </div>
    </div>`;
}

async function init(){
  try{
    const raw     = await fetchJSON(BASE + 'history/history.json');
    const entries = (Array.isArray(raw) ? raw : (raw.runs || []))
      .slice()
      .sort((a,b) => new Date(b.timestamp||0) - new Date(a.timestamp||0));

    const latest    = entries[0];
    const awsRuns   = entries.filter(e => (e.scenario||'').includes('aws'));
    const entraRuns = entries.filter(e => (e.scenario||'').includes('entra'));
    const gcpRuns   = entries.filter(e => (e.scenario||'').includes('gcp'));

    document.getElementById('summary-bar').innerHTML = `
      <div class="sum-card"><div class="val">${entries.length}</div><div class="lbl">Total runs</div></div>
      <div class="sum-card"><div class="val" style="color:#3fb950">${awsRuns.length}</div><div class="lbl">AWS runs</div></div>
      <div class="sum-card"><div class="val" style="color:#58a6ff">${entraRuns.length}</div><div class="lbl">Azure runs</div></div>
      <div class="sum-card"><div class="val" style="color:#ffa657">${gcpRuns.length}</div><div class="lbl">GCP runs</div></div>
      <div class="sum-card"><div class="val">${latest ? new Date(latest.timestamp).toLocaleDateString() : '—'}</div><div class="lbl">Latest run</div></div>
      <div class="sum-card"><div class="val">${latest ? Number(latest.compliance_rate||0).toFixed(1)+'%' : '—'}</div><div class="lbl">Latest compliance</div></div>`;

    if(!entries.length){
      document.getElementById('history-grid').innerHTML =
        '<div class="empty">No runs recorded yet. Run an assessment to start building history.</div>';
      return;
    }

    document.getElementById('history-grid').innerHTML = entries.map((e,i) => buildHistCard(e,i)).join('');

  }catch(err){
    console.error('Failed to load history:', err);
    document.getElementById('history-grid').innerHTML =
      '<div class="empty">Unable to load history. (Error: ' + err.message + ')</div>';
  }
}

init();
</script>
</body>
</html>
